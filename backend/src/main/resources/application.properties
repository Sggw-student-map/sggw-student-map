spring.application.name=sggwstudentmap

# polaczenie z baza danych
spring.datasource.url=jdbc:postgresql://localhost:5432/sggw_student_map
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate - none bo Flyway zarzadza schematem
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway - uruchamia sie PRZED JPA
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Debug logging dla Flyway
logging.level.org.flywaydb=DEBUG