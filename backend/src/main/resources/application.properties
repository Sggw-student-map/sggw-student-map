# ==========================================================================
# Actuator / Health probes
# --------------------------------------------------------------------------
# Bezpieczenstwo sieciowe:
#  - osobny port management (8081) zbindowany WYLACZNIE do loopbacka (127.0.0.1),
#    w Dockerfile nie robimy na nim EXPOSE -> endpoint nie istnieje z zewnatrz,
#  - przez HTTP wystawiamy WYLACZNIE /actuator/health (info/env/beans/heapdump/
#    loggers itd. sa niedostepne -> brak typowej powierzchni ataku na Actuator),
#  - show-details=never -> w odpowiedzi tylko {"status":"UP|DOWN"}, bez wersji
#    bazy, schematu, nazw HealthIndicatorow i innych wyciekow.
# ==========================================================================
management.server.port=8081
management.server.address=127.0.0.1

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# wlaczenie podgrup /actuator/health/liveness i /actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Liveness = "aplikacja zyje" -> CELOWO bez sprawdzania DB, zeby chwilowy
# outage Neona nie powodowal restart-loopa kontenera.
# Readiness = "aplikacja jest gotowa przyjmowac ruch" -> wlacznie z DB.
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db

# DataSourceHealthIndicator jest auto-konfigurowany, ale ustawiamy jawnie.
management.health.db.enabled=true
management.health.defaults.enabled=true

