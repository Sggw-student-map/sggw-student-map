<div class="min-h-screen w-full flex flex-col items-center justify-center bg-gradient-to-tr from-green-100 via-yellow-50 to-pink-100 relative overflow-hidden">

  <div class="z-10 flex flex-col items-center text-center">
    
    <div class="mb-4">
      <img src="/logo.png" alt="Logo SGGWmapka" class="w-32 h-32 object-contain drop-shadow-lg">
    </div>

    <h1 class="text-4xl font-serif font-bold text-black tracking-wide mb-8">
      SGGWmapka
    </h1>

    <div class="w-80 flex flex-col items-center gap-4 bg-white/70 p-8 rounded-[2rem] shadow-[0_8px_30px_rgba(0,0,0,0.04)] border border-white/50 backdrop-blur-sm">
      
      <div *ngIf="status === 'loading'" class="flex flex-col items-center w-full">
        <svg class="animate-spin h-12 w-12 text-emerald-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <h2 class="text-xl font-bold text-gray-800">Sprawdzanie...</h2>
        <p class="mt-2 text-sm text-gray-600 font-medium">{{ message }}</p>
      </div>

      <div *ngIf="status === 'success'" class="flex flex-col items-center w-full">
        <div class="flex items-center justify-center h-16 w-16 rounded-full bg-emerald-100 mb-4 shadow-inner">
          <svg class="h-8 w-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Sukces!</h2>
        <p class="text-sm text-gray-600 font-medium mb-8">{{ message }}</p>
        
        <a routerLink="/login" class="w-full h-12 flex items-center justify-center rounded-full px-6 text-center font-semibold bg-emerald-500 text-white hover:bg-emerald-600 transition-colors shadow-[0_4px_10px_rgba(0,0,0,0.1)]">
          Przejdź do logowania
        </a>
      </div>

      <div *ngIf="status === 'error'" class="flex flex-col items-center w-full">
        <div class="flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-4 shadow-inner">
          <svg class="h-8 w-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Wystąpił błąd</h2>
        <p class="text-sm text-gray-600 font-medium mb-8">{{ message }}</p>
        
        <a routerLink="/login" class="w-full h-12 flex items-center justify-center rounded-full px-6 text-center font-semibold bg-white text-gray-700 hover:text-emerald-500 transition-colors shadow-[0_4px_10px_rgba(0,0,0,0.05)]">
          Wróć do logowania
        </a>
      </div>

    </div>

  </div>
</div>
