<div class="relative min-h-screen bg-[#e8ebec] w-full overflow-hidden font-sans">
  
  <div class="absolute top-4 left-4 w-72 flex flex-col gap-4 max-h-[calc(100vh-2rem)] z-10">
    
    <button routerLink="/map" class="w-full bg-[#4ADE80] text-white font-bold py-4 rounded-[2rem] hover:bg-green-500 transition shadow-md flex items-center justify-center gap-2 text-lg">
      <span>←</span> Wróć do Mapki
    </button>

    <div class="bg-white/60 backdrop-blur-md rounded-3xl shadow-2xl border border-white/20 p-6 flex flex-col min-h-0">
      
      <nav class="flex flex-col gap-3">
        
        <a *ngFor="let item of menuItems" 
           [routerLink]="item.route" 
           [ngClass]="{'text-green-800 font-semibold': item.name === 'Powiadomienia', 'text-gray-800': item.name !== 'Powiadomienia'}"
           class="flex items-center gap-4 text-lg hover:text-green-700 transition-colors cursor-pointer">
           <div class="w-9 h-9 flex-shrink-0 rounded-xl shadow-sm" [ngClass]="item.colorClass"></div> 
           {{item.name}}
        </a>
        
        <div class="h-[1px] bg-white/50 my-1 w-full"></div> 
        
        <a href="#" class="flex items-center gap-4 text-lg text-gray-800 hover:text-green-700 transition-colors">
          <div class="w-9 h-9 flex-shrink-0 rounded-full bg-red-200 shadow-sm"></div> Profil
        </a>
        <a href="#" class="flex items-center gap-4 text-lg text-gray-800 hover:text-green-700 transition-colors">
          <div class="w-9 h-9 flex-shrink-0 rounded-full bg-gray-200 shadow-sm"></div> Ustawienia
        </a>

      </nav>

    </div>
  </div>

  <div class="h-screen w-full flex justify-center overflow-y-auto pl-[300px]"> 
    <div class="w-full max-w-2xl py-8 px-4 flex flex-col gap-4">
      
      <h2 class="text-3xl font-bold text-gray-800 mb-4">Powiadomienia</h2>

      <div *ngFor="let notif of notifications" 
           class="bg-white rounded-[2rem] p-5 shadow-sm hover:shadow-md transition-shadow flex items-start gap-4 relative">
        
        <div [ngClass]="notif.placeholderColor" class="w-[52px] h-[52px] rounded-full flex items-center justify-center text-white font-bold text-lg shadow-sm mt-1 flex-shrink-0">
        </div>

        <div class="flex-grow pr-8">
          <p class="text-gray-900 text-[15px] leading-relaxed">
            <span class="font-bold">{{notif.actorName}}</span> 
            {{notif.actionText}} 
            <span class="font-semibold text-gray-700">"{{notif.targetName}}"</span>.
          </p>
          <span class="text-sm text-gray-400 mt-1 block">{{notif.time}}</span>
        </div>

        <div *ngIf="notif.isUnread" class="w-[10px] h-[10px] rounded-full bg-blue-500 absolute top-1/2 right-6 -translate-y-1/2"></div>
        
        <div class="absolute bottom-4 right-5 text-xl">
          <span *ngIf="notif.actionType === 'LIKE'" class="text-red-500"></span>
          <span *ngIf="notif.actionType === 'COMMENT'" class="text-purple-300 drop-shadow-sm"></span>
          <span *ngIf="notif.actionType === 'NEW_OPINION'" class="text-yellow-400 drop-shadow-sm"></span>
        </div>
      </div>

    </div>
  </div>
</div>
