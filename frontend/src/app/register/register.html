<div class="min-h-screen w-full flex flex-col items-center justify-center bg-gradient-to-tr from-green-100 via-yellow-50 to-pink-100 relative overflow-hidden">
  <div class="z-10 flex flex-col items-center">
    <div class="mb-4">
      <img src="/logo.png" alt="Logo SGGWmapka" class="w-24 h-24 object-contain drop-shadow-lg">
    </div>

    <h1 class="text-3xl font-serif font-bold text-black tracking-wide mb-8">
      Rejestracja
    </h1>

    <div class="flex flex-col gap-3 w-80">
      <input #firstNameInput type="text" placeholder="Imie"
        class="w-full h-11 rounded-full px-6 text-center text-gray-700 font-medium bg-white/90 shadow-[0_4px_10px_rgba(0,0,0,0.05)] border border-transparent focus:outline-none focus:border-green-300 focus:ring-2 focus:ring-green-100 transition-all placeholder:text-gray-400 placeholder:font-normal">

      <input #lastNameInput type="text" placeholder="Nazwisko"
        class="w-full h-11 rounded-full px-6 text-center text-gray-700 font-medium bg-white/90 shadow-[0_4px_10px_rgba(0,0,0,0.05)] border border-transparent focus:outline-none focus:border-green-300 focus:ring-2 focus:ring-green-100 transition-all placeholder:text-gray-400 placeholder:font-normal">

      <input #usernameInput type="text" placeholder="Login"
        class="w-full h-11 rounded-full px-6 text-center text-gray-700 font-medium bg-white/90 shadow-[0_4px_10px_rgba(0,0,0,0.05)] border border-transparent focus:outline-none focus:border-green-300 focus:ring-2 focus:ring-green-100 transition-all placeholder:text-gray-400 placeholder:font-normal">

      <input #emailInput type="email" placeholder="Email"
        class="w-full h-11 rounded-full px-6 text-center text-gray-700 font-medium bg-white/90 shadow-[0_4px_10px_rgba(0,0,0,0.05)] border border-transparent focus:outline-none focus:border-green-300 focus:ring-2 focus:ring-green-100 transition-all placeholder:text-gray-400 placeholder:font-normal">

      <input #passwordInput type="password" placeholder="Haslo"
        (keyup.enter)="onRegister(firstNameInput.value, lastNameInput.value, usernameInput.value, emailInput.value, passwordInput.value)"
        class="w-full h-11 rounded-full px-6 text-center text-gray-700 font-medium bg-white/90 shadow-[0_4px_10px_rgba(0,0,0,0.05)] border border-transparent focus:outline-none focus:border-green-300 focus:ring-2 focus:ring-green-100 transition-all placeholder:text-gray-400 placeholder:font-normal">

      <button type="button"
        (click)="onRegister(firstNameInput.value, lastNameInput.value, usernameInput.value, emailInput.value, passwordInput.value)"
        [disabled]="isLoading"
        class="w-full h-11 rounded-full px-6 text-center font-semibold bg-emerald-500 text-white hover:bg-emerald-600 disabled:opacity-70 disabled:cursor-not-allowed transition-colors">
        {{ isLoading ? 'Tworzenie konta...' : 'Utworz konto' }}
      </button>

      <p *ngIf="errorMessage" class="text-center text-red-600 text-sm">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="text-center text-emerald-700 text-sm">{{ successMessage }}</p>
    </div>

    <div class="mt-5 text-sm">
      <span class="text-gray-500">Masz juz konto? </span>
      <a routerLink="/login" class="text-emerald-500 font-semibold hover:text-emerald-600 transition-colors">Wroc do logowania</a>
    </div>
  </div>
</div>
