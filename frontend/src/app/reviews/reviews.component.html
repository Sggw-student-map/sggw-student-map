<div class="reviews-panel">

  <!-- Average rating -->
  <div class="average-rating" *ngIf="reviews.length">
    <span class="stars">
      <span *ngFor="let s of getStars(averageRating)">{{ s }}</span>
    </span>
    <span class="avg-label">{{ averageRating | number:'1.1-1' }} / 5</span>
    <span class="count">({{ reviews.length }} opinii)</span>
  </div>

  <!-- Existing reviews -->
  <div class="review-list">
    <div class="review-card" *ngFor="let review of reviews">
      <div class="review-header">
        <span class="author">{{ review.author || 'Użytkownik' }}</span>
        <span class="stars small">
          <span *ngFor="let s of getStars(review.rating)">{{ s }}</span>
        </span>
      </div>
      <p class="comment">{{ review.comment }}</p>
    </div>
    <p class="no-reviews" *ngIf="!reviews.length">Brak opinii. Bądź pierwszy!</p>
  </div>

  <!-- Add review form -->
  <div class="add-review">
    <h4>Dodaj opinię</h4>

    <div class="star-picker">
      <span
        *ngFor="let star of [1,2,3,4,5]"
        (click)="setRating(star)"
        (mouseenter)="hoveredStar = star"
        (mouseleave)="hoveredStar = 0"
        [class.active]="star <= (hoveredStar || newRating)"
      >★</span>
    </div>

    <textarea
      [(ngModel)]="newComment"
      placeholder="Napisz opinię..."
      rows="3"
    ></textarea>

    <button
      (click)="submitReview()"
      [disabled]="!newRating || !newComment.trim() || isSubmitting"
    >
      {{ isSubmitting ? 'Wysyłanie...' : 'Wyślij opinię' }}
    </button>
  </div>

</div>
