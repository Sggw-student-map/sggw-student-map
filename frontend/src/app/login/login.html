<div class="login-page relative min-h-screen w-full overflow-hidden bg-gradient-to-tr from-emerald-50 via-yellow-50 to-pink-100">

  <div class="login-bg pointer-events-none absolute inset-0">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="grid-overlay"></span>
  </div>

  <div class="relative z-10 flex min-h-screen w-full flex-col lg:flex-row">

    <section class="flex w-full items-center justify-center px-6 py-10 sm:px-10 lg:w-[46%] lg:px-16">
      <div class="glass-card w-full max-w-md">

        <div class="flex flex-col items-center text-center">
          <div class="logo-wrap mb-3">
            <img src="/logo.png" alt="Logo SGGWmapka" class="h-20 w-20 object-contain drop-shadow-lg sm:h-24 sm:w-24">
          </div>
          <h1 class="font-serif text-3xl font-bold tracking-wide text-slate-900 sm:text-4xl">SGGWmapka</h1>
          <p class="mt-2 text-sm text-slate-500">Witaj ponownie! Zaloguj się, aby kontynuować.</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="mt-8 flex flex-col gap-4">

          <div>
            <label class="mb-1 ml-1 block text-xs font-semibold uppercase tracking-wider text-slate-500">Login</label>
            <input
              type="text"
              formControlName="username"
              placeholder="np. jan.kowalski"
              autocomplete="username"
              class="login-input"
              [ngClass]="{'input-error': loginForm.get('username')?.invalid && loginForm.get('username')?.touched}"
            >
            <p *ngIf="loginForm.get('username')?.hasError('required') && loginForm.get('username')?.touched" class="mt-1 ml-1 text-left text-xs text-red-500">
              Login jest wymagany.
            </p>
          </div>

          <div>
            <label class="mb-1 ml-1 block text-xs font-semibold uppercase tracking-wider text-slate-500">Hasło</label>
            <input
              type="password"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="login-input"
              [ngClass]="{'input-error': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
            >
            <p *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched" class="mt-1 ml-1 text-left text-xs text-red-500">
              Hasło jest wymagane.
            </p>
          </div>

          <button
            type="submit"
            [disabled]="isLoading"
            class="login-btn mt-2"
          >
            <span *ngIf="!isLoading">Zaloguj</span>
            <span *ngIf="isLoading" class="inline-flex items-center gap-2">
              <span class="spinner"></span>
              Logowanie...
            </span>
          </button>

          <p *ngIf="errorMessage" class="mt-1 text-center text-sm text-red-600">{{ errorMessage }}</p>
        </form>

        <div class="mt-6 text-center text-sm">
          <span class="text-slate-500">Nie masz konta? </span>
          <a routerLink="/register" class="font-semibold text-emerald-600 transition-colors hover:text-emerald-700">Zarejestruj się!</a>
        </div>

      </div>
    </section>

    <section class="campus-pane relative hidden overflow-hidden lg:flex lg:w-[54%]">

      <div class="absolute inset-0">
        <div
          *ngFor="let slide of slides; let i = index"
          class="slide"
          [class.active]="i === currentSlide"
          [attr.aria-hidden]="i !== currentSlide"
        >
          <div class="slide-bg" [style.background]="slide.gradient"></div>

          <img
            *ngIf="slide.imageOk"
            [src]="slide.src"
            [alt]="slide.title"
            class="slide-img"
            (error)="onImageError(slide)"
            loading="lazy"
          >

          <div class="slide-overlay"></div>

          <div class="slide-content">
            <span class="slide-eyebrow">SGGW · Warszawa</span>
            <h2 class="slide-title">{{ slide.title }}</h2>
            <p class="slide-subtitle">{{ slide.subtitle }}</p>
          </div>
        </div>
      </div>

      <button
        type="button"
        class="slide-nav slide-nav-prev"
        (click)="prevSlide()"
        aria-label="Poprzednie zdjęcie"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button
        type="button"
        class="slide-nav slide-nav-next"
        (click)="nextSlide()"
        aria-label="Następne zdjęcie"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <div class="slide-dots">
        <button
          *ngFor="let slide of slides; let i = index"
          type="button"
          class="slide-dot"
          [class.active]="i === currentSlide"
          (click)="goToSlide(i)"
          [attr.aria-label]="'Przejdź do slajdu ' + (i + 1)"
        ></button>
      </div>

    </section>

  </div>
</div>
