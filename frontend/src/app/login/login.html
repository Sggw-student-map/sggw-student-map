<div class="min-h-screen w-full flex flex-col items-center justify-center bg-gradient-to-tr from-green-100 via-yellow-50 to-pink-100 relative overflow-hidden">

  <div class="z-10 flex flex-col items-center">
    
    <div class="mb-4">
      <img src="/logo.png" alt="Logo SGGWmapka" class="w-32 h-32 object-contain drop-shadow-lg">
    </div>

    <h1 class="text-4xl font-serif font-bold text-black tracking-wide mb-8">
      SGGWmapka
    </h1>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="flex flex-col gap-4 w-64">
      
      <div>
        <input 
          type="text" 
          formControlName="username"
          placeholder="Login" 
          class="w-full h-12 rounded-full px-6 text-center text-gray-700 font-medium bg-white/90 shadow-[0_4px_10px_rgba(0,0,0,0.05)] border transition-all placeholder:text-gray-400 placeholder:font-normal"
          [ngClass]="{'border-red-500 focus:ring-red-200': loginForm.get('username')?.invalid && loginForm.get('username')?.touched, 'border-transparent focus:border-green-300 focus:ring-green-100': !(loginForm.get('username')?.invalid && loginForm.get('username')?.touched)}"
        >
        <p *ngIf="loginForm.get('username')?.hasError('required') && loginForm.get('username')?.touched" class="text-red-500 text-xs mt-1 ml-4 text-left">
          Login jest wymagany.
        </p>
      </div>

      <div>
        <input 
          type="password" 
          formControlName="password"
          placeholder="Hasło" 
          class="w-full h-12 rounded-full px-6 text-center text-gray-700 font-medium bg-white/90 shadow-[0_4px_10px_rgba(0,0,0,0.05)] border transition-all placeholder:text-gray-400 placeholder:font-normal"
          [ngClass]="{'border-red-500 focus:ring-red-200': loginForm.get('password')?.invalid && loginForm.get('password')?.touched, 'border-transparent focus:border-green-300 focus:ring-green-100': !(loginForm.get('password')?.invalid && loginForm.get('password')?.touched)}"
        >
        <p *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched" class="text-red-500 text-xs mt-1 ml-4 text-left">
          Hasło jest wymagane.
        </p>
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full h-12 rounded-full px-6 text-center font-semibold bg-emerald-500 text-white hover:bg-emerald-600 disabled:opacity-70 disabled:cursor-not-allowed transition-colors"
      >
        {{ isLoading ? 'Logowanie...' : 'Zaloguj' }}
      </button>

      <p *ngIf="errorMessage" class="text-center text-red-600 text-sm mt-2">{{ errorMessage }}</p>
    </form>

    <div class="mt-6 text-sm">
      <span class="text-gray-500">Nie masz konta? </span>
      <a routerLink="/register" class="text-emerald-500 font-semibold hover:text-emerald-600 transition-colors">Zarejestruj się!</a>
    </div>

  </div>
</div>
