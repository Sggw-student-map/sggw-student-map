<div class="relative w-full h-screen overflow-hidden">
  
  <div id="map" class="absolute inset-0 z-0 h-full w-full"></div>

  <div class="absolute inset-0 z-[1000] pointer-events-none">

    <div class="absolute top-4 left-4 w-72 flex flex-col gap-4 pointer-events-none max-h-[calc(100vh-2rem)]">
      
      <div class="bg-white/60 backdrop-blur-md rounded-3xl shadow-2xl border border-white/20 p-6 flex flex-col min-h-0 pointer-events-auto shrink">
        
        <div class="flex items-center gap-4 mb-6 flex-shrink-0">
          <div class="w-14 h-14 rounded-full bg-green-700 flex items-center justify-center text-white font-bold text-2xl border-4 border-white shadow-lg">
            M
          </div>
          <div>
            <div class="text-xl font-bold text-gray-900 leading-tight">Marta</div>
            <div class="text-sm text-green-700 font-medium">Witaj ponownie!</div>
          </div>
        </div>

        <nav class="overflow-y-auto pr-2 space-y-3 custom-scrollbar shrink">
          <a *ngFor="let item of menuItems" href="#" class="flex items-center gap-4 text-lg text-gray-800 hover:text-green-700 transition-colors">
            <div class="w-9 h-9 flex items-center justify-center rounded-xl text-xl shadow-sm {{item.color}}">
            </div> 
            {{item.name}}
          </a>
          
          <div class="h-px bg-white/40 my-4"></div> <a href="#" class="flex items-center gap-4 text-lg text-gray-800 hover:text-green-700 transition-colors">
            <div class="w-9 h-9 flex items-center justify-center rounded-full bg-red-200 text-red-700 text-xl shadow-sm"></div> Profil
          </a>
          <a href="#" class="flex items-center gap-4 text-lg text-gray-800 hover:text-green-700 transition-colors">
            <div class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-200 text-gray-700 text-xl shadow-sm"></div> Ustawienia
          </a>
        </nav>
      </div>

      <div class="bg-white/60 backdrop-blur-md rounded-3xl shadow-2xl border border-white/20 p-5 flex-shrink-0 pointer-events-auto">
        <h3 class="text-base font-semibold text-gray-900 mb-4">Sortuj pinezki według:</h3>
        <ul class="space-y-3 text-sm text-gray-800">
          <li class="flex items-center justify-between p-2 rounded-xl bg-green-50/50 transition-colors">
            <span class="flex items-center gap-3"><div class="w-6 h-6 rounded-full bg-cyan-200 text-cyan-700 flex items-center justify-center shadow-sm"></div> Ostatnie</span>
            <span class="text-green-600 font-bold">✓</span>
          </li>
          <li class="flex items-center gap-3 p-2 text-gray-600 hover:bg-white/50 rounded-xl transition-colors">
            <div class="w-6 h-6 rounded-full bg-pink-200 text-pink-700 flex items-center justify-center shadow-sm"></div> Najwyżej oceniane
          </li>
          <li class="flex items-center gap-3 p-2 text-gray-600 hover:bg-white/50 rounded-xl transition-colors">
            <div class="w-6 h-6 rounded-full bg-orange-200 text-orange-700 flex items-center justify-center shadow-sm"></div> Znajomi
          </li>
          <li class="flex items-center gap-3 p-2 text-gray-600 hover:bg-white/50 rounded-xl transition-colors">
            <div class="w-6 h-6 rounded-full bg-red-200 text-red-700 flex items-center justify-center shadow-sm"></div> Zapisane
          </li>
        </ul>
      </div>

    </div>

    <div class="absolute top-4 left-[320px] right-4 flex items-start justify-between pointer-events-none">
      
      <div class="relative w-full max-w-lg pointer-events-auto">
        <div class="absolute inset-y-0 left-0 flex items-center pl-5 pointer-events-none text-gray-400 text-lg"></div>
        <input type="text" 
               class="w-full h-14 pl-14 pr-6 bg-white/60 backdrop-blur-md rounded-full shadow-2xl border border-white/20 text-gray-800 placeholder:text-gray-500 focus:ring-2 focus:ring-green-400 focus:outline-none transition-all"
               placeholder="Wyszukaj na mapie...">
      </div>

      <div class="flex items-center gap-3 pointer-events-auto ml-4">
        <button class="w-14 h-14 rounded-full bg-cyan-400 flex items-center justify-center text-white text-2xl shadow-xl hover:bg-cyan-500 transition-colors"></button>
        <button class="w-14 h-14 rounded-full bg-green-400 flex items-center justify-center text-white text-2xl shadow-xl hover:bg-green-500 transition-colors"></button>
        <button class="w-14 h-14 rounded-full bg-purple-400 flex items-center justify-center text-white text-2xl shadow-xl hover:bg-purple-500 transition-colors"></button>
        <div class="w-14 h-14 rounded-full bg-green-700 border-4 border-white shadow-xl flex items-center justify-center text-white font-bold text-xl ml-1">M</div>
      </div>
    </div>

  </div>
</div>
